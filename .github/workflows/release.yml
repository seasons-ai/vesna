name: release

# A tag is a release. `npm version <patch|minor|major>` makes the commit and
# the tag; pushing the tag runs this. Nothing here needs a one-time code, so
# a release cannot fail on a 30-second window the way a manual publish did
# three times in a row.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # the GitHub Release
  id-token: write   # npm provenance

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: The tag names the version package.json ships
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag but package.json says $pkg" >&2
            exit 1
          fi

      - name: Refuse to publish a version the registry already has
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if npm view "@seasons-ai/vesna@$pkg" version >/dev/null 2>&1; then
            echo "@seasons-ai/vesna@$pkg is already published" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install what was just published, and run it
        run: |
          pkg="$(node -p "require('./package.json').version")"
          cd "$(mktemp -d)"
          npm init -y >/dev/null
          # The registry replicates reads behind writes, sometimes for minutes.
          # Loud, so the reason is in the log; and an explicit failure when it
          # never arrives, rather than a missing binary two lines later.
          ok=0
          for i in $(seq 1 15); do
            if npm install --prefer-online "@seasons-ai/vesna@$pkg"; then ok=1; break; fi
            echo "attempt $i: not replicated yet, waiting 20s"
            sleep 20
          done
          if [ "$ok" != 1 ]; then
            echo "@seasons-ai/vesna@$pkg did not become installable within five minutes" >&2
            exit 1
          fi
          ./node_modules/.bin/vesna --version | grep -qx "$pkg"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
