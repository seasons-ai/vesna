name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Both, because the terminal code reads the environment and spawns
    # processes, and those are exactly the places the two diverge.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        # The suite is offline by design; anything reaching the network here
        # is a defect in the test, not a flaky runner.
        run: bun test

      - name: The CLI starts and reports honestly without credentials
        run: |
          bun bin/vesna --help
          # No config and no credentials: it must refuse clearly, not crash.
          cd "$(mktemp -d)"
          if bun "$GITHUB_WORKSPACE/bin/vesna" do "hi"; then
            echo "expected a non-zero exit without credentials" >&2
            exit 1
          fi

  package:
    # What a user installs is the tarball, not the checkout. This job
    # builds it, installs it into an empty directory, and runs the binary
    # from there — the same check that is done by hand after each publish,
    # so it stops depending on someone remembering to.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # The floor named in package.json's engines, so the tarball is
          # proven against the oldest Bun it claims to run on.
          bun-version: 1.2.0

      - name: Pack
        run: |
          npm pack
          ls -l seasons-ai-vesna-*.tgz

      - name: Install the tarball somewhere empty and run it
        run: |
          tgz="$(ls "$GITHUB_WORKSPACE"/seasons-ai-vesna-*.tgz)"
          cd "$(mktemp -d)"
          npm init -y >/dev/null
          npm install --silent "$tgz"
          ./node_modules/.bin/vesna --version
          ./node_modules/.bin/vesna --help | grep -q "vesna build"
          # No config and no credentials: refuse clearly, from the installed copy.
          if ./node_modules/.bin/vesna do "hi"; then
            echo "expected a non-zero exit without credentials" >&2
            exit 1
          fi
