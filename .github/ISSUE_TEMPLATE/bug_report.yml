name: Bug report
description: Something did not do what the README says it does.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `vesna --version`, and your OS.
      placeholder: "0.3.2, macOS 15"
    validations:
      required: true
  - type: textarea
    id: did
    attributes:
      label: What you did
      description: The exact command or chat input. Redact keys.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Paste the actual output, not a description of it.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
